name: Deploy to Prod

# Deploys to prod in exactly two situations:
#   1. A PR into `main` whose HEAD IS `staging` — i.e. the real promotion
#      path, dev-tested code being promoted. Deploying pre-merge means a
#      prod deploy failure surfaces and gets fixed before the merge button
#      is available, same model as deploy-dev.yml/staging.
#   2. A push to `main` (the merge itself), which re-deploys the merged
#      state and triggers sync-staging below.
#
# The head-branch check on (1) exists because of a real incident on
# 2026-09-21/22: `branches: [main]` only filters the PR's BASE, so ANY
# branch with a PR open against `main` — including one opened by accident,
# e.g. by clicking GitHub's suggested "Compare & pull request" banner,
# which defaults its base to the repo default branch — turned every
# subsequent push to that branch into a live prod deploy. An
# `agent/*` feature branch did exactly that, silently deploying WIP
# Cloud Functions to prod 3 times over a working session before anyone
# noticed, and it had already happened once before on another branch.
# A stray PR against `main` must be inert; only a deliberate
# staging→main promotion is prod-bound.
#
# NOTE: this means a `hotfix/*` branch PR'd straight into `main` no longer
# deploys when the PR opens — it deploys on merge (the push trigger). If
# you want pre-merge deploy verification for hotfixes too, add
# `|| startsWith(github.head_ref, 'hotfix/')` to the deploy job's `if:`.
#
# Pair this with a required-status-check branch protection rule on `main`
# for the `deploy` job — without it, GitHub still lets you merge a PR whose
# deploy failed or is still running. The workflow alone gives you the
# signal; the branch rule is what actually blocks the merge button.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  deploy:
    # A pull_request event only deploys when it's the staging→main
    # promotion; a push to main (the merge) always deploys. See the header
    # comment for why this guard exists.
    if: github.event_name == 'push' || github.head_ref == 'staging'
    uses: ./.github/workflows/_deploy-kidclub-env.yml
    permissions:
      contents: 'read'
      id-token: 'write'
    secrets: inherit
    with:
      environment: rainbow-prod-2454b
      firebase_project: rainbow-prod-2454b
      service_account: github-action-1020915538@rainbow-prod-2454b.iam.gserviceaccount.com
      build_command: pnpm --filter kidclub build
      tf_var_file: env/prod.tfvars
      # Prod's "rainbow-prod-2454b" state prefix was found essentially
      # empty (81 pending creates, plus a hard error in storage.tf) the
      # first time this pipeline actually ran a plan against it — real
      # prod infra was never brought under Terraform. Auto-applying that
      # blind against live prod is not safe. Re-enable once prod state is
      # deliberately reconciled (see apps/noisyphocus/kidclub/STATUS.md)
      # — app/rules/indexes/functions/hosting deploy automatically either
      # way, this only pauses the terraform step.
      run_terraform: false

  sync-staging:
    name: 'Sync staging with main'
    needs: deploy
    # Only after an actual merge — the deploy job also runs on a
    # staging→main PR (see the `on:` block above), and staging has no
    # business being resynced from a PR that hasn't merged yet. On a push
    # the deploy job always runs, so `needs: deploy` is satisfied here.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: 'write'
      pull-requests: 'write'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fast-forward staging to main
        id: ff
        run: |
          git fetch origin main staging
          git checkout staging
          if git merge --ff-only origin/main; then
            git push origin staging
            echo "ff=true" >> "$GITHUB_OUTPUT"
          else
            echo "ff=false" >> "$GITHUB_OUTPUT"
          fi

      # staging has commits main doesn't (e.g. an in-progress feature not
      # yet promoted) — can't fast-forward, so open a PR instead of forcing
      # it. Someone needs to actually look at this merge.
      - name: Open sync PR if fast-forward wasn't possible
        if: steps.ff.outputs.ff == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="sync/main-to-staging-${{ github.run_id }}"
          git checkout -b "$BRANCH" origin/main
          git push origin "$BRANCH"
          gh pr create --base staging --head "$BRANCH" \
            --title "sync: bring staging up to date with main" \
            --body "Automatic sync after a prod deploy (merge to main, run ${{ github.run_id }}). staging had commits main doesn't, so this couldn't fast-forward — resolve here before merging so dev doesn't drift from prod."
