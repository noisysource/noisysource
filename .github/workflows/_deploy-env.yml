name: Deploy one environment of a deploy unit (reusable)

# The generic deploy: one Google Cloud project of one deploy unit. A unit is a
# project pair with its own Terraform root, its own Firebase project folder
# (firebase.json, rules, indexes, functions) and its own apps; the table of
# units and their paths is UNITS in .github/scripts/deploy-parts.mjs.
#
# Used by the NoisySource unit (noisysource-dev / noisysource-prod). KidClub
# still deploys through _deploy-kidclub-env.yml and moves here last
# (infra/HANDOFF-repo-restructure.md). The rules are the same as there, and the
# reasons are written up in that file's header:
#   - one job per part, each with its own concurrency group, never cancelled
#     midway;
#   - with only_changed, only the parts the PR/push changes deploy;
#   - everything is built and checked in the plan job before anything deploys;
#   - order: terraform, rules + indexes, functions, hosting. A failed job
#     stops everything after it.
#
# A part is on only once its files exist, so the unit can be built up one PR
# at a time without touching this file:
#   terraform          <tf_dir>/ exists
#   firestore_rules    <firebase_dir>/firestore.rules exists
#   firestore_indexes  <firebase_dir>/firestore.indexes.json exists
#   functions          <firebase_dir>/functions/package.json exists
#   an app             <firebase_dir>/firebase.json has its hosting target
#
# A hosting target's "public" must be "hosting/<target>": the hosting job puts
# the app's build there (firebase deploy only serves folders inside the
# Firebase project folder).

on:
  workflow_call:
    inputs:
      unit:
        description: "Deploy unit, as named in UNITS in deploy-parts.mjs (e.g. 'noisysource')"
        required: true
        type: string
      environment:
        description: "The project id. Also the Terraform state prefix and the concurrency-group label."
        required: true
        type: string
      service_account:
        description: "Deploy service account to act as, through workload identity"
        required: true
        type: string
      firebase_dir:
        description: "The unit's Firebase project folder (holds firebase.json)"
        required: true
        type: string
      tf_dir:
        description: "The unit's Terraform root"
        required: true
        type: string
      tf_var_file:
        description: "This environment's tfvars, relative to tf_dir"
        required: true
        type: string
      apps:
        description: >
          The unit's hosted apps, as a JSON list of
          {"part": the app's part name in deploy-parts.mjs,
           "dir": the app folder, "build": the build command for this
           environment, "target": its hosting target in firebase.json,
           optional "firebase": false for an app with no Firebase SDK in its
           bundle, so no projectId to check (the public website)}.
        required: false
        type: string
        default: '[]'
      only_changed:
        description: "Deploy only the parts the PR/push changed. Default false: deploy every part."
        required: false
        type: boolean
        default: false

env:
  WIF_PROVIDER: 'projects/245453200769/locations/global/workloadIdentityPools/github-pool/providers/github-provider'

jobs:
  plan:
    name: "Plan + build (${{ inputs.environment }})"
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
    outputs:
      terraform: ${{ steps.parts.outputs.terraform }}
      firestore_rules: ${{ steps.parts.outputs.firestore_rules }}
      firestore_indexes: ${{ steps.parts.outputs.firestore_indexes }}
      functions: ${{ steps.parts.outputs.functions }}
      # JSON list of the apps (entries of inputs.apps) to deploy in this run.
      hosting: ${{ steps.apps.outputs.hosting }}
    steps:
      # A pull_request run checks out GitHub's merge commit; its first parent
      # is the current staging, so depth 2 is enough to diff the PR against it.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: ${{ inputs.only_changed && github.event_name == 'pull_request' && 2 || 1 }}

      - name: Work out which parts to deploy
        id: parts
        env:
          UNIT: ${{ inputs.unit }}
          ONLY_CHANGED: ${{ inputs.only_changed }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          FORCED: ${{ github.event.forced }}
          TF_DIR: ${{ inputs.tf_dir }}
          FB_DIR: ${{ inputs.firebase_dir }}
          APPS: ${{ inputs.apps }}
        run: |
          set -euo pipefail
          # Parts whose files don't exist yet are off (see the header).
          disabled=()
          [ -d "$TF_DIR" ] || disabled+=(terraform)
          [ -f "$FB_DIR/firestore.rules" ] || disabled+=(firestore_rules)
          [ -f "$FB_DIR/firestore.indexes.json" ] || disabled+=(firestore_indexes)
          [ -f "$FB_DIR/functions/package.json" ] || disabled+=(functions)
          while IFS=$'\t' read -r part target; do
            [ -n "$part" ] || continue
            if ! [ -f "$FB_DIR/firebase.json" ] || ! jq -e --arg t "$target" \
              '[.hosting] | flatten | map(.target?) | index($t) != null' "$FB_DIR/firebase.json" >/dev/null; then
              disabled+=("$part")
            fi
          done < <(jq -r '.[] | [.part, .target] | @tsv' <<<"$APPS")
          DISABLED_PARTS=$(IFS=,; echo "${disabled[*]-}")
          export DISABLED_PARTS
          echo "Parts that are off (no files yet): ${DISABLED_PARTS:-none}"

          plan() { node .github/scripts/deploy-parts.mjs --unit "$UNIT" "$@"; }
          if [ "$ONLY_CHANGED" != "true" ]; then
            plan --all "this environment always deploys every part"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            if git rev-parse -q --verify 'HEAD^2' >/dev/null; then
              plan --base 'HEAD^1' --head HEAD
            else
              plan --all "the PR checkout isn't a merge commit, so what it changes can't be told"
            fi
          elif [ "$EVENT_NAME" = "push" ]; then
            if [ "$FORCED" = "true" ]; then
              plan --all "force push: the previous tip isn't an ancestor, so the diff means nothing"
            elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              plan --all "first push of the branch: nothing to diff against"
            elif ! git fetch --no-tags --depth=1 origin "$BEFORE"; then
              plan --all "couldn't fetch the previous tip $BEFORE"
            else
              plan --base "$BEFORE" --head HEAD
            fi
          else
            plan --all "$EVENT_NAME run: deploy every part"
          fi

      # Which of the unit's apps this run deploys.
      - name: List the apps to deploy
        id: apps
        env:
          APPS: ${{ inputs.apps }}
          PARTS: ${{ toJSON(steps.parts.outputs) }}
        run: |
          set -euo pipefail
          hosting=$(jq -c --argjson parts "$PARTS" '[.[] | select($parts[.part] == "true")]' <<<"$APPS")
          echo "hosting=$hosting" >> "$GITHUB_OUTPUT"
          echo "Apps to deploy: $hosting"

      - name: Set up pnpm
        if: steps.parts.outputs.functions == 'true' || steps.apps.outputs.hosting != '[]'
        uses: pnpm/action-setup@v4 # version: packageManager in root package.json

      - name: Set up Node.js
        if: steps.parts.outputs.functions == 'true' || steps.apps.outputs.hosting != '[]'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.parts.outputs.functions == 'true' || steps.apps.outputs.hosting != '[]'
        run: pnpm install --frozen-lockfile

      # A bundle built in the wrong mode deploys fine and then breaks login.
      # Each Vite bundle contains its Firebase config once as
      # projectId:"<id>" (Vite 8's minifier writes projectId:`<id>`, FinHub);
      # refuse to go on unless it's this project. An app marked
      # "firebase": false has no Firebase config to check.
      - name: Build the apps and check they target ${{ inputs.environment }}
        if: steps.apps.outputs.hosting != '[]'
        env:
          HOSTING: ${{ steps.apps.outputs.hosting }}
          PROJECT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dists"
          while IFS=$'\t' read -r part dir build firebase; do
            echo "::group::Build $part"
            bash -euo pipefail -c "$build"
            echo "::endgroup::"
            if [ "$firebase" = "false" ]; then
              test -f "$dir/dist/index.html"
              echo "$part: no Firebase SDK in the bundle, projectId check skipped"
            elif ! grep -rqE "projectId:[\"\`]$PROJECT[\"\`]" "$dir/dist/assets"; then
              echo "::error::$dir was built for another Firebase project (expected $PROJECT). Check its build command and its .env.<mode> file."
              exit 1
            fi
            tar -czf "$RUNNER_TEMP/dists/$part.tgz" -C "$dir" dist
          done < <(jq -r '.[] | [.part, .dir, .build, (if .firebase == false then "false" else "true" end)] | @tsv' <<<"$HOSTING")

      # A compile error stops the run here, before terraform or rules deploy.
      - name: Build the functions
        if: steps.parts.outputs.functions == 'true'
        run: pnpm --dir "${{ inputs.firebase_dir }}/functions" run build

      # Hosting jobs deploy exactly the bundles built and checked above.
      - name: Upload the app builds
        if: steps.apps.outputs.hosting != '[]'
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ inputs.environment }}
          path: ${{ runner.temp }}/dists
          if-no-files-found: error
          retention-days: 3
          overwrite: true # a re-run of this job replaces its own upload

  terraform:
    name: "Terraform (${{ inputs.environment }})"
    needs: plan
    if: needs.plan.outputs.terraform == 'true'
    concurrency:
      group: deploy-${{ inputs.environment }}-terraform
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ inputs.service_account }}

      - name: Export access token
        run: echo "GOOGLE_OAUTH_ACCESS_TOKEN=$(gcloud auth print-access-token)" >> "$GITHUB_ENV"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          # Plain output, so `terraform show -json` is JSON and nothing else.
          terraform_wrapper: false

      - name: Terraform init
        working-directory: ${{ inputs.tf_dir }}
        run: terraform init -backend-config="prefix=${{ inputs.environment }}" -reconfigure

      # The deploy service account can't change IAM (on purpose). A change to
      # the root's iam.tf fails here until Renato has applied it by hand; see
      # the README in the Terraform root.
      # A pull request applies only what it creates or changes; what its plan
      # would delete or replace is left for staging (pr-safe.mjs says why).
      - name: Terraform plan
        working-directory: ${{ inputs.tf_dir }}
        run: terraform plan -var-file="${{ inputs.tf_var_file }}" -input=false -out=tfplan

      - name: Terraform apply
        working-directory: ${{ inputs.tf_dir }}
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            terraform apply -input=false -auto-approve tfplan
            exit 0
          fi
          terraform show -json tfplan > plan.json
          node "$GITHUB_WORKSPACE/.github/scripts/pr-safe.mjs" terraform plan.json > safe.json
          kept=$(jq -r '.kept | join(", ")' safe.json)
          if [ -n "$kept" ]; then
            echo "::warning title=Terraform: kept for staging::This PR's plan would delete or replace $kept on a shared dev project. A PR never removes things; merge into staging to do that."
          fi
          if [ "$(jq '.targets | length' safe.json)" = "0" ]; then
            echo "Nothing for a PR to apply."
            exit 0
          fi
          if [ -z "$kept" ]; then
            terraform apply -input=false -auto-approve tfplan
            exit 0
          fi
          mapfile -t targets < <(jq -r '.targets[] | "-target=" + .' safe.json)
          terraform apply -var-file="${{ inputs.tf_var_file }}" -input=false -auto-approve "${targets[@]}"

  rules:
    name: "Rules + indexes (${{ inputs.environment }})"
    needs: [plan, terraform]
    if: >-
      needs.plan.result == 'success' && !cancelled()
      && (needs.terraform.result == 'success' || needs.terraform.result == 'skipped')
      && (needs.plan.outputs.firestore_rules == 'true' || needs.plan.outputs.firestore_indexes == 'true')
    concurrency:
      group: deploy-${{ inputs.environment }}-rules
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ inputs.service_account }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Export access token
        run: echo "GOOGLE_OAUTH_ACCESS_TOKEN=$(gcloud auth print-access-token)" >> "$GITHUB_ENV"

      - name: Deploy Firestore Rules
        if: needs.plan.outputs.firestore_rules == 'true'
        working-directory: ${{ inputs.firebase_dir }}
        run: firebase deploy --only firestore:rules --project=${{ inputs.environment }} --token "$GOOGLE_OAUTH_ACCESS_TOKEN"

      - name: Deploy Firestore Indexes
        if: needs.plan.outputs.firestore_indexes == 'true'
        working-directory: ${{ inputs.firebase_dir }}
        run: firebase deploy --only firestore:indexes --project=${{ inputs.environment }} --token "$GOOGLE_OAUTH_ACCESS_TOKEN"

  functions:
    name: "Functions (${{ inputs.environment }})"
    needs: [plan, terraform, rules]
    if: >-
      needs.plan.result == 'success' && !cancelled()
      && (needs.terraform.result == 'success' || needs.terraform.result == 'skipped')
      && (needs.rules.result == 'success' || needs.rules.result == 'skipped')
      && needs.plan.outputs.functions == 'true'
    concurrency:
      group: deploy-${{ inputs.environment }}-functions
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4 # version: packageManager in root package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ inputs.service_account }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Export access token
        run: echo "GOOGLE_OAUTH_ACCESS_TOKEN=$(gcloud auth print-access-token)" >> "$GITHUB_ENV"

      # A pull request deploys only the functions its own code exports, so it
      # never tries to delete another open PR's functions on dev (pr-safe.mjs).
      - name: Deploy Cloud Functions
        working-directory: ${{ inputs.firebase_dir }}
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          only=functions
          if [ "$EVENT_NAME" = "pull_request" ]; then
            pnpm --dir functions run build
            codebase=$(jq -r '.functions.codebase // empty' firebase.json)
            # Loading the code only to read its names: without the deploy's credentials,
            # which firebase-admin can't read at start-up (it runs initializeApp on load).
            only=$(env -u GOOGLE_APPLICATION_CREDENTIALS -u CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE -u GOOGLE_GHA_CREDS_PATH node "$GITHUB_WORKSPACE/.github/scripts/pr-safe.mjs" functions "$PWD/functions/lib/index.js" "$codebase")
          fi
          firebase deploy --only "$only" --project=${{ inputs.environment }} --token "$GOOGLE_OAUTH_ACCESS_TOKEN"

  # One job per app, each with its own concurrency group, so one app's deploy
  # never waits on or cancels another's.
  hosting:
    name: "Hosting: ${{ matrix.app.part }} (${{ inputs.environment }})"
    needs: [plan, terraform, rules, functions]
    if: >-
      needs.plan.result == 'success' && !cancelled()
      && (needs.terraform.result == 'success' || needs.terraform.result == 'skipped')
      && (needs.rules.result == 'success' || needs.rules.result == 'skipped')
      && (needs.functions.result == 'success' || needs.functions.result == 'skipped')
      && needs.plan.outputs.hosting != '[]' && needs.plan.outputs.hosting != ''
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.hosting) }}
    concurrency:
      group: deploy-${{ inputs.environment }}-hosting-${{ matrix.app.part }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download the app builds
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ inputs.environment }}
          path: ${{ runner.temp }}/dists

      # firebase deploy refuses a hosting folder outside the Firebase project
      # folder, so the build goes to <firebase_dir>/hosting/<target>, which is
      # what the target's "public" in firebase.json points at.
      - name: Unpack this app's build
        env:
          DEST: ${{ inputs.firebase_dir }}/hosting/${{ matrix.app.target }}
        run: |
          mkdir -p "$DEST"
          tar -xzf "$RUNNER_TEMP/dists/${{ matrix.app.part }}.tgz" -C "$DEST" --strip-components=1
          test -f "$DEST/index.html"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ inputs.service_account }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Export access token
        run: echo "GOOGLE_OAUTH_ACCESS_TOKEN=$(gcloud auth print-access-token)" >> "$GITHUB_ENV"

      - name: Deploy hosting
        working-directory: ${{ inputs.firebase_dir }}
        run: firebase deploy --only hosting:${{ matrix.app.target }} --project=${{ inputs.environment }} --token "$GOOGLE_OAUTH_ACCESS_TOKEN"
