name: Deploy KidClub + FinHub Environment (reusable)

# Shared deploy logic for one environment (dev or prod). Called by
# deploy-dev.yml (PR/push to staging) and deploy-prod.yml (push to main).
# Deploys KidClub (app, rules, indexes, functions, hosting) and FinHub's
# hosting. FinHub has no rules/functions of its own: it shares this
# project's Firestore rules and the /functions codebase deployed below.
#
# Both apps are built before anything deploys, so a broken FinHub build
# stops the run before KidClub goes out half-updated, and vice versa.
#
# Order: terraform first, then rules/indexes, then functions/hosting.
# Terraform owns IAM (e.g. which secrets the deploy SA can read) — running
# it first means a newly-added grant is live before the step that needs it
# runs, instead of that step failing on the very same run that would have
# fixed it. Rules/indexes still go before functions/hosting, so nothing is
# ever live against a schema it doesn't expect. No continue-on-error
# anywhere — a failed step here must stop the job, not let a half-deployed
# state look green.

on:
  workflow_call:
    inputs:
      environment:
        description: "Label for logs/backend prefix, e.g. 'kidclub-dev' or 'rainbow-prod-2454b'"
        required: true
        type: string
      firebase_project:
        description: "Firebase/GCP project id to deploy into"
        required: true
        type: string
      service_account:
        description: "Workload-identity service account to authenticate as"
        required: true
        type: string
      build_command:
        description: "Command that builds the KidClub app for this environment"
        required: true
        type: string
      finances_build_command:
        description: >
          Command that builds FinHub for this environment: build:staging for
          kidclub-dev, build for prod. The other mode bakes in the wrong
          Firebase config, which breaks login; the check step below catches it.
        required: true
        type: string
      tf_var_file:
        description: "Path (relative to infra/gcp/terraform) to this environment's tfvars"
        required: true
        type: string
      run_terraform:
        description: >
          Whether to run terraform init/apply for this environment. Default true.
          Set false for an environment whose Terraform state isn't actually
          reconciled with reality yet — e.g. prod's state prefix was found to be
          essentially empty (81 pending creates against already-live infra) when
          this was first wired up. Turning this off is a stopgap, not a fix: the
          app/rules/indexes/functions/hosting steps below don't depend on it and
          stay fully automated either way.
        required: false
        type: boolean
        default: true
      deploy_storage_rules:
        description: >
          Whether to deploy storage.rules. Off by default: Firebase Storage was
          only ever activated/used on kidclub-dev (FinHub insurances, KidClub
          payment proofs), and deploying rules to a project whose Storage isn't
          active fails the whole job. Turn on for prod once Storage is active
          there and its rules have been checked (see kidclub STATUS.md).
        required: false
        type: boolean
        default: false

jobs:
  deploy:
    name: "Deploy KidClub + FinHub (${{ inputs.environment }})"
    # One deploy at a time per environment. Both dev PRs and staging pushes
    # run `terraform apply` against the same GCS state prefix, so two
    # overlapping runs collide on the state lock and the later one dies with
    # "Error acquiring the state lock ... 412 conditionNotMet". That has now
    # happened twice — once across two branches, once from two pushes to the
    # same branch 2.5 minutes apart (the second was a docs-only commit that
    # needed no deploy at all).
    #
    # cancel-in-progress is deliberately FALSE: cancelling a run mid
    # `terraform apply` is what leaves a genuinely stale lock behind, which
    # then needs a manual force-unlock. Queue instead. GitHub keeps only the
    # newest pending run per group, so rapid pushes collapse rather than pile up.
    concurrency:
      group: deploy-kidclub-${{ inputs.environment }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build KidClub app
        run: ${{ inputs.build_command }}

      - name: Build FinHub app
        run: ${{ inputs.finances_build_command }}

      # A bundle built in the wrong mode (dev config in prod or the reverse)
      # deploys fine and then breaks login. Each Vite bundle contains its
      # Firebase config once as projectId:"<id>"; refuse to deploy unless it's
      # this environment's project.
      - name: Check both builds target ${{ inputs.firebase_project }}
        run: |
          for app in apps/noisyphocus/kidclub apps/noisysource/finances; do
            if ! grep -rqF 'projectId:"${{ inputs.firebase_project }}"' "$app/dist/assets"; then
              echo "::error::$app was built for another Firebase project (expected ${{ inputs.firebase_project }}). Check its build command (build:staging = kidclub-dev, build = prod)."
              exit 1
            fi
          done

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/245453200769/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: ${{ inputs.service_account }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # Exported once so every later step (firebase --token, terraform) can
      # just reference $GOOGLE_OAUTH_ACCESS_TOKEN without re-invoking gcloud.
      - name: Export access token
        run: echo "GOOGLE_OAUTH_ACCESS_TOKEN=$(gcloud auth print-access-token)" >> "$GITHUB_ENV"

      - name: Set up Terraform
        if: inputs.run_terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        if: inputs.run_terraform
        working-directory: infra/gcp/terraform
        run: terraform init -backend-config="prefix=${{ inputs.environment }}" -reconfigure

      # Applies unconditionally when run_terraform is true (see root
      # CLAUDE.md's "Branch → environment pipeline" for why). If the
      # service account is missing an IAM role for some resource, this
      # fails closed — no partial apply silently skipped, no separate
      # manual apply step waiting after it.
      #
      # billing_account_id has no default (budget.tf) so every apply needs
      # it regardless of environment, even though the budget resource
      # itself only exists where manage_combined_budget is true. Comes from
      # a repo secret, not committed — it's not highly sensitive, but
      # there's no reason to put it in a file either.
      - name: Terraform apply
        if: inputs.run_terraform
        working-directory: infra/gcp/terraform
        run: terraform apply -var-file="${{ inputs.tf_var_file }}" -var="billing_account_id=${{ secrets.BILLING_ACCOUNT_ID }}" -auto-approve

      - name: Deploy Firestore Rules
        run: firebase deploy --only firestore:rules --project=${{ inputs.firebase_project }} --token "$GOOGLE_OAUTH_ACCESS_TOKEN"

      - name: Deploy Firestore Indexes
        run: firebase deploy --only firestore:indexes --project=${{ inputs.firebase_project }} --token "$GOOGLE_OAUTH_ACCESS_TOKEN"

      - name: Deploy Storage Rules
        if: inputs.deploy_storage_rules
        run: firebase deploy --only storage --project=${{ inputs.firebase_project }} --token "$GOOGLE_OAUTH_ACCESS_TOKEN" --non-interactive

      - name: Deploy Cloud Functions
        run: firebase deploy --only functions --project=${{ inputs.firebase_project }} --token "$GOOGLE_OAUTH_ACCESS_TOKEN"

      - name: Deploy KidClub Hosting
        run: firebase deploy --only hosting:kidclub --project=${{ inputs.firebase_project }} --token "$GOOGLE_OAUTH_ACCESS_TOKEN"

      - name: Deploy FinHub Hosting
        run: firebase deploy --only hosting:finances --project=${{ inputs.firebase_project }} --token "$GOOGLE_OAUTH_ACCESS_TOKEN"
