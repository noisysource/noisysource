name: Deploy Functions

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: 'Environment to deploy to'
        required: true
        options:
          - dev
          - prod

jobs:
  deploy-dev-functions:
    name: 'Deploy: dev-functions'
    if: github.event.inputs.environment == 'dev'
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Prepare Functions for deployment
        run: |
          cd functions
          pnpm install --prod
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/245453200769/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'gmail-sender-kidclub-dev@kidclub-dev.iam.gserviceaccount.com'
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Deploy Cloud Functions
        run: firebase deploy --only functions --project=kidclub-dev --token "$(gcloud auth print-access-token)"

  deploy-prod-functions:
    name: 'Deploy: prod-functions'
    if: github.event.inputs.environment == 'prod'
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Prepare Functions for deployment
        run: |
          cd functions
          pnpm install --prod
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/245453200769/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-action-1020915538@rainbow-prod-2454b.iam.gserviceaccount.com'
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Deploy Cloud Functions
        run: firebase deploy --only functions --project=rainbow-prod-2454b --token "$(gcloud auth print-access-token)"
