name: Build and Deploy KidClub

on:
  # Auto-deploy to dev on every PR open/update targeting main, so a reviewer
  # has a live preview without needing a manual workflow_dispatch.
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  # Auto-deploy to prod on every push to main (i.e. every merged PR), gated by
  # the `production` GitHub Environment's required-reviewer rule (see below).
  # staging pushes still build, matching prior behavior, but nothing deploys
  # them automatically — no deploy job below matches a staging push.
  push:
    branches:
      - main
      - staging
  # Ad-hoc, human-triggered deploy to any branch/environment combination
  # outside the normal PR -> dev -> merge -> prod flow. Intentionally left
  # ungated by the production Environment: this is already an explicit
  # manual action, not an automatic one.
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: 'Environment to deploy to'
        required: true
        options:
          - dev
          - prod

concurrency:
  group: kidclub-deploy-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: 'Build KidClub'
    runs-on: ubuntu-latest
    # Resolves once per job, from context available at trigger time (no step
    # output needed): pull_request and workflow_dispatch(dev) build against the
    # dev Firebase config; everything else (push, workflow_dispatch(prod))
    # builds prod, matching this file's behavior before this env var existed.
    env:
      DEPLOY_TARGET: ${{ (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')) && 'dev' || 'prod' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Build KidClub app (Dev)
        if: env.DEPLOY_TARGET == 'dev'
        run: pnpm --filter kidclub build:staging
      - name: Build KidClub app (Prod/default)
        if: env.DEPLOY_TARGET == 'prod'
        run: pnpm --filter kidclub build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: kidclub-build
          path: apps/noisyphocus/kidclub/dist

  # Manual, ad-hoc deploy — unchanged from before: any branch, admin-chosen
  # environment, no approval gate (the workflow_dispatch click already is one).
  deploy-manual:
    name: 'Deploy KidClub (manual)'
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: kidclub-build
          path: apps/noisyphocus/kidclub/dist
      - name: Authenticate to Google Cloud (Dev)
        if: github.event.inputs.environment == 'dev'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/245453200769/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'gmail-sender-kidclub-dev@kidclub-dev.iam.gserviceaccount.com'
      - name: Authenticate to Google Cloud (Prod)
        if: github.event.inputs.environment == 'prod'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/245453200769/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-action-1020915538@rainbow-prod-2454b.iam.gserviceaccount.com'
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      # Rules deploy before the app deploy, same branch/environment already selected
      # above, so the app is never live against stale rules. No continue-on-error /
      # if: always() here on purpose — a failed rules deploy must stop the job before
      # the app deploy step runs, not fail silently and let a stale-rules app go live.
      - name: Deploy Firestore Rules (Dev)
        if: github.event.inputs.environment == 'dev'
        run: firebase deploy --only firestore:rules --project=kidclub-dev --token "$(gcloud auth print-access-token)"
      - name: Deploy Firestore Rules (Prod)
        if: github.event.inputs.environment == 'prod'
        run: firebase deploy --only firestore:rules --project=rainbow-prod-2454b --token "$(gcloud auth print-access-token)"
      - name: Deploy KidClub App (Dev)
        if: github.event.inputs.environment == 'dev'
        run: firebase deploy --only hosting:kidclub --project=kidclub-dev --token "$(gcloud auth print-access-token)"
      - name: Deploy KidClub App (Prod)
        if: github.event.inputs.environment == 'prod'
        run: firebase deploy --only hosting:kidclub --project=rainbow-prod-2454b --token "$(gcloud auth print-access-token)"

  # Auto-deploy to dev for every PR targeting main — no approval gate, dev is
  # meant to move freely so a reviewer always has a current preview.
  deploy-dev-pr:
    name: 'Deploy KidClub (dev, PR preview)'
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: kidclub-build
          path: apps/noisyphocus/kidclub/dist
      - name: Authenticate to Google Cloud (Dev)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/245453200769/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'gmail-sender-kidclub-dev@kidclub-dev.iam.gserviceaccount.com'
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Deploy Firestore Rules (Dev)
        run: firebase deploy --only firestore:rules --project=kidclub-dev --token "$(gcloud auth print-access-token)"
      - name: Deploy KidClub App (Dev)
        run: firebase deploy --only hosting:kidclub --project=kidclub-dev --token "$(gcloud auth print-access-token)"

  # Auto-deploy to prod on every push to main. Gated by the `production`
  # GitHub Environment's required-reviewer protection rule (configured in repo
  # Settings, not here) — the job sits as "Waiting for approval" before this
  # or any step below runs, so no prod credential is touched until a human
  # approves in the Actions tab.
  deploy-prod-main:
    name: 'Deploy KidClub (prod)'
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: kidclub-build
          path: apps/noisyphocus/kidclub/dist
      - name: Authenticate to Google Cloud (Prod)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/245453200769/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-action-1020915538@rainbow-prod-2454b.iam.gserviceaccount.com'
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Deploy Firestore Rules (Prod)
        run: firebase deploy --only firestore:rules --project=rainbow-prod-2454b --token "$(gcloud auth print-access-token)"
      - name: Deploy KidClub App (Prod)
        run: firebase deploy --only hosting:kidclub --project=rainbow-prod-2454b --token "$(gcloud auth print-access-token)"
